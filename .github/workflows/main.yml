name: Waka Readme

on:
  schedule:
    - cron: '*/59 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: waka-readme
  cancel-in-progress: false

jobs:
  update-readme:
    name: Update total code minutes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Combine normal and AI code time
        env:
          WAKATIME_API_KEY: ${{ secrets.WAKATIME_API_KEY }}
        run: |
          python3 - <<'PY'
          import base64
          import json
          import math
          import os
          from pathlib import Path
          from urllib.request import Request, urlopen

          auth = base64.b64encode(os.environ["WAKATIME_API_KEY"].encode()).decode()
          request = Request(
              "https://wakatime.com/api/v1/users/current/stats/all_time",
              headers={"Authorization": f"Basic {auth}"},
          )
          with urlopen(request, timeout=60) as response:
              if response.status != 200:
                  raise RuntimeError("WakaTime all-time stats are not ready")
              data = json.load(response)["data"]
          if data.get("is_up_to_date") is False:
              raise RuntimeError("WakaTime is still calculating all-time stats")
          ai = next(item for item in data["categories"] if item["name"] == "AI Coding")
          seconds = [data["total_seconds"], ai["total_seconds"]]
          if any(not isinstance(value, (int, float)) or not math.isfinite(value) or value < 0 for value in seconds):
              raise ValueError("Invalid WakaTime totals")
          minutes = math.floor(sum(seconds) / 60)

          readme = Path("README.md")
          content = readme.read_text(encoding="utf-8")
          start = "<!--START_SECTION:waka-->"
          end = "<!--END_SECTION:waka-->"
          before, section = content.split(start, 1)
          _, after = section.split(end, 1)
          counter = (
              '<p>\n'
              '  <img align="left" src="https://readme-sigma-ten.vercel.app/api/visitors" alt="Profile views" />\n'
              f'  <img align="right" src="https://readme-sigma-ten.vercel.app/api/code-time?minutes={minutes}&amp;v=2" '
              f'alt="Total code time: {minutes:,} minutes" />\n'
              '</p>\n'
              '<br clear="both" />'
          )
          readme.write_text(f"{before}{start}\n{counter}\n{end}{after}", encoding="utf-8")
          print(f"Total code time: {minutes:,} minutes")
          PY
      - name: Publish updated counter
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update total code minutes"
          git pull --rebase
          git push
